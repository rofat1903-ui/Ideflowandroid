name: Build IDE FLOW APK

on:
  workflow_dispatch:
  push:
    paths:
      - "IDE-FLOW-v3-GitHub-Actions-Ready.zip"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract IDE FLOW
        run: |
          mkdir build-src
          unzip -q IDE-FLOW-v3-GitHub-Actions-Ready.zip -d build-src

      - name: Find Android project
        run: |
          PROJECT_DIR=$(find build-src -name gradlew -type f -print -quit | xargs dirname)
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IDE-FLOW-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
